# Builds the Windows (x64, CPU) VST3 for an existing GitHub release and
# attaches the zip to it. Run it by hand (Actions > Windows release build >
# Run workflow) after the release exists. fcpe.onnx, cent_table.bin,
# mel_filterbank.bin and pc_nsf_hifigan.onnx are in the repository; CMake
# downloads the GAME models from the OpenVPI release during configure.
name: Windows release build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (e.g. v0.1.0). Leave empty for a test build."
        required: false
        default: ""
      ref:
        description: "Test build: build this branch or commit instead of the tag and keep the zip as a workflow artifact (the release is not changed)"
        required: false
        default: ""
      diagnostics:
        description: "Build with ARA diagnostics, which log the model graph to %APPDATA%/Kisyo Tune/Logs/. For investigating a host that does not load audio."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout the source with submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          submodules: recursive
          persist-credentials: false

      # Use the runner's default Visual Studio generator (as upstream PitchNet
      # does) and the CPU build of ONNX Runtime; DirectML is the Windows
      # default in CMakeLists.txt, so turn it off explicitly.
      - name: Configure
        run: >
          cmake -B build -DUSE_DIRECTML=OFF -DPITCHNET_DEV_BUILD=OFF
          -DPITCHNET_ARA_DIAGNOSTICS=${{ inputs.diagnostics && 'ON' || 'OFF' }}
          -DPITCHNET_BUILD_TESTS=OFF

      - name: Build the VST3
        run: cmake --build build --config Release --target PitchNetPlugin_VST3 --parallel

      # Two zips, because they answer different needs. The models are about
      # 130 MB of the 147 and never change between builds, so anyone who has
      # installed this plug-in - or Kinu Tune, whose models it reads as a
      # fallback - needs only the plug-in to try a new build. The full zip
      # stays for a first install.
      - name: Package
        shell: pwsh
        run: |
          $version = "$env:RELEASE_TAG".TrimStart('v')
          if (-not $version) { $version = "test-$($env:GITHUB_SHA.Substring(0,8))" }
          if ("${{ inputs.diagnostics }}" -eq "true") { $version = "$version-aradiag" }
          $base = "Kisyo-Tune-$version-Windows-x64"
          $lite = "$base-plugin-only"
          $vst3 = "build/PitchNetPlugin_artefacts/Release/VST3/Kisyo Tune.vst3"
          if (-not (Test-Path $vst3)) { throw "VST3 bundle not found at $vst3" }

          foreach ($dir in $base, $lite) {
            New-Item -ItemType Directory -Force -Path "$dir/licenses" | Out-Null
            Copy-Item -Recurse $vst3 "$dir/"
            Copy-Item LICENSE, THIRD_PARTY_NOTICES.txt, MODIFICATIONS.md "$dir/"
            Copy-Item licenses/* "$dir/licenses/"
          }

          New-Item -ItemType Directory -Force -Path "$base/models" | Out-Null
          foreach ($f in "fcpe.onnx", "cent_table.bin", "mel_filterbank.bin", "pc_nsf_hifigan.onnx") {
            Copy-Item "Resources/models/$f" "$base/models/"
          }
          Copy-Item -Recurse "Resources/models/GAME" "$base/models/"
          Copy-Item packaging/INSTALL-Windows.txt "$base/INSTALL.txt"
          Copy-Item packaging/INSTALL-Windows-plugin-only.txt "$lite/INSTALL.txt"

          Compress-Archive -Path $base -DestinationPath "$base.zip"
          Compress-Archive -Path $lite -DestinationPath "$lite.zip"

          "ZIP_NAME=$base" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LITE_ZIP_NAME=$lite" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem *.zip | ForEach-Object {
            "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }

      - name: Attach to the release
        if: ${{ inputs.tag != '' && inputs.ref == '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$env:RELEASE_TAG" "$env:ZIP_NAME.zip" "$env:LITE_ZIP_NAME.zip" --repo "$env:GITHUB_REPOSITORY" --clobber

      # Uploaded separately so the plug-in can be downloaded on its own:
      # a single artifact holding both would make every download carry the
      # models again.
      - name: Keep the plug-in-only build as a workflow artifact
        if: ${{ inputs.tag == '' || inputs.ref != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.LITE_ZIP_NAME }}
          path: ${{ env.LITE_ZIP_NAME }}.zip
          retention-days: 14

      - name: Keep the full build as a workflow artifact
        if: ${{ inputs.tag == '' || inputs.ref != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
          retention-days: 14
