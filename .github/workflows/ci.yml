# Checks every push and pull request: builds Kinu Tune with the unit tests on
# macOS (Apple silicon) and runs them, and builds the Windows VST3 so code that
# only one compiler accepts is caught before a release.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-tests:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout the source with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      # The Core ML vocoder is not in the repository and the tests load no
      # model, so the model check only warns here.
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DPITCHNET_BUILD_TESTS=ON
          -DPITCHNET_REQUIRE_MODELS=OFF

      # The hosted macOS runner has 3 CPUs and 7 GB of memory; an unbounded
      # parallel build starts dozens of compilers at once.
      #
      # The output is kept and published like the test output: a build failure
      # is served from blob storage some environments cannot reach, so without
      # this a red build says only that it was red.
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 3 2>&1 | tee build.log

      # --no-tests=error because ctest exits 0 when it finds nothing to run, so
      # without it a test that failed to register reads as a green run - the
      # same vacuous pass that tests/CMakeLists.txt warns about for assert().
      #
      # The output is kept so the run can be read somewhere that cannot reach
      # the blob storage GitHub serves job logs and artifacts from. The step
      # records its own result and the job fails at the end instead, so the
      # log is published either way.
      - name: Run the unit tests
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --no-tests=error 2>&1 | tee ctest.log

      # The correction suites are named explicitly so that losing one of them
      # from the build is a failure rather than a smaller test run nobody
      # notices.
      - name: Run the correction test suites
        id: correction_tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --no-tests=error \
            -R "GuideSourceTests|GuidedPitchCorrectionTests|MidiFileReaderTests|MidiGuideCorrectionTests|RegionMappingTests|TimingAnchorsTests|TimingMapTests" \
            2>&1 | tee ctest-correction.log

      - name: Publish the test output to the ci-logs branch
        if: always()
        continue-on-error: true
        run: |
          set -eu
          work=/tmp/logrepo
          dest="$work/runs/${{ github.run_id }}"
          rm -rf "$work"
          mkdir -p "$dest"
          cp ctest*.log build.log "$dest/" 2>/dev/null || true
          cd "$work"
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI test output for run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

      - name: Fail if the build or any test failed
        if: steps.build.outcome != 'success' || steps.tests.outcome != 'success' || steps.correction_tests.outcome != 'success'
        run: |
          echo "build: ${{ steps.build.outcome }}"
          echo "unit tests: ${{ steps.tests.outcome }}"
          echo "correction suites: ${{ steps.correction_tests.outcome }}"
          exit 1

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout the source with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure
        run: cmake -B build -DUSE_DIRECTML=OFF -DPITCHNET_BUILD_TESTS=OFF

      - name: Build the VST3
        run: cmake --build build --config Release --target PitchNetPlugin_VST3 --parallel
